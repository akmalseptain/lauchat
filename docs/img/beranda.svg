<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 660" font-family="Geist, ui-sans-serif, system-ui, sans-serif">
  <rect width="480" height="660" fill="#000000"/>

  <!-- header -->
  <g transform="translate(40,20)">
    <rect width="20" height="16" rx="4" fill="#3b82f6"/>
    <path d="M5 16 l-3 5 6.5-4.5z" fill="#3b82f6"/>
    <circle cx="10" cy="8" r="4.5" fill="#ffffff"/><circle cx="10" cy="8" r="1.8" fill="#3b82f6"/>
    <text x="28" y="17" fill="#fafafa" font-size="15" font-weight="600" letter-spacing="1">LAUCHAT</text>
  </g>
  <g transform="translate(360,24)">
    <circle cx="6" cy="8" r="3" fill="#16a34a"/>
    <text x="16" y="12" fill="#a1a1aa" font-size="12" font-family="Geist Mono, ui-monospace, monospace">12 online</text>
  </g>

  <!-- hero -->
  <text x="40" y="90" fill="#fafafa" font-size="26" font-weight="600">Ngobrol dengan orang asing.</text>
  <text x="40" y="114" fill="#a1a1aa" font-size="14">Dipasangkan acak dengan siapa pun yang online. Tanpa akun, tanpa server.</text>

  <!-- kartu -->
  <g transform="translate(40,138)">
    <rect width="400" height="376" rx="12" fill="none" stroke="#27272a"/>
    <g font-size="13">
      <rect x="16" y="16" width="368" height="40" rx="10" fill="none" stroke="#27272a"/>
      <text x="28" y="41" fill="#71717a">Nama (opsional)</text>
      <rect x="16" y="64" width="368" height="40" rx="10" fill="none" stroke="#27272a"/>
      <text x="28" y="89" fill="#71717a">Topik, mis. musik, game (opsional)</text>
      <rect x="16" y="116" width="180" height="38" rx="10" fill="none" stroke="#27272a"/>
      <text x="28" y="139" fill="#fafafa">Saya: cowok</text>
      <rect x="204" y="116" width="180" height="38" rx="10" fill="none" stroke="#27272a"/>
      <text x="216" y="139" fill="#fafafa">Cari: cewek</text>
      <rect x="16" y="160" width="180" height="38" rx="10" fill="none" stroke="#27272a"/>
      <text x="28" y="183" fill="#fafafa">Fasih: Indonesia</text>
      <rect x="204" y="160" width="180" height="38" rx="10" fill="none" stroke="#27272a"/>
      <text x="216" y="183" fill="#fafafa">Belajar: English</text>
      <rect x="16" y="210" width="15" height="15" rx="4" fill="none" stroke="#a1a1aa" stroke-width="1.5"/>
      <text x="39" y="222" fill="#a1a1aa">Deteksi AI lawan: baca wajah, auto-skip bila tak sesuai</text>
    </g>
    <rect x="16" y="246" width="180" height="40" rx="8" fill="#16a34a"/>
    <path d="M42 275 a9 9 0 1 0 -3.4-3.4 L36 274z" fill="none" stroke="#ffffff" stroke-width="1.6"/>
    <text x="62" y="271" fill="#ffffff" font-size="14" font-weight="500">Chat teks</text>
    <rect x="204" y="246" width="180" height="40" rx="8" fill="none" stroke="#27272a"/>
    <rect x="222" y="258" width="18" height="13" rx="2" fill="none" stroke="#fafafa" stroke-width="1.5"/>
    <path d="M242 261 l8 5 -8 5z" fill="none" stroke="#fafafa" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="256" y="271" fill="#fafafa" font-size="14" font-weight="500">Chat video</text>

    <line x1="16" y1="306" x2="384" y2="306" stroke="#27272a"/>
    <rect x="16" y="322" width="204" height="40" rx="10" fill="none" stroke="#27272a"/>
    <text x="118" y="347" fill="#71717a" font-size="12" font-family="Geist Mono, ui-monospace, monospace" text-anchor="middle" letter-spacing="3">KODE ROOM</text>
    <rect x="232" y="326" width="70" height="32" rx="8" fill="none" stroke="#27272a"/>
    <text x="267" y="346" fill="#fafafa" font-size="13" text-anchor="middle">Masuk</text>
    <rect x="310" y="326" width="90" height="32" rx="8" fill="none" stroke="#27272a"/>
