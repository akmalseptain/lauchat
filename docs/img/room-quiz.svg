<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 1040" font-family="VT323, ui-monospace, Menlo, Consolas, monospace">
  <rect width="480" height="1040" fill="#09090b"/>

  <!-- header -->
  <text x="40" y="42" fill="#fafafa" font-size="14" font-weight="bold">ROOM AB12CD</text>
  <text x="180" y="42" fill="#a1a1aa" font-size="14">·</text>
  <text x="190" y="42" fill="#a1a1aa" font-size="15">3 orang</text>

  <!-- video grid 3 cell -->
  <g transform="translate(40,58)">
    <rect width="400" height="200" fill="#000000"/>
    <rect x="0" y="0" width="131" height="200" fill="#111113"/>
    <rect x="135" y="0" width="131" height="200" fill="#14141a"/>
    <rect x="269" y="0" width="131" height="200" fill="#111113"/>
    <rect x="6" y="176" width="46" height="18" rx="3" fill="rgba(0,0,0,.55)"/>
    <text x="13" y="189" fill="#e6e6e6" font-size="13">aku</text>
    <rect x="141" y="176" width="46" height="18" rx="3" fill="rgba(0,0,0,.55)"/>
    <text x="148" y="189" fill="#e6e6e6" font-size="13">dina</text>
    <rect x="275" y="176" width="40" height="18" rx="3" fill="rgba(0,0,0,.55)"/>
    <text x="282" y="189" fill="#e6e6e6" font-size="13">boi</text>
    <rect x="362" y="8" width="26" height="26" rx="6" fill="rgba(0,0,0,.55)" stroke="rgba(255,255,255,.18)"/>
    <path d="M368 14 h8 v8 M376 14 v8 h-8" fill="none" stroke="#e6e6e6" stroke-width="1.5"/>
    <rect width="400" height="200" fill="none" stroke="#27272a"/>
  </g>

  <!-- members -->
  <text x="40" y="286" fill="#a1a1aa" font-size="15">aku · dina · boi</text>

  <!-- game bar -->
  <g transform="translate(40,300)" font-size="14" text-anchor="middle">
    <rect x="0" y="0" width="120" height="32" rx="8" fill="none" stroke="#27272a"/>
    <text x="60" y="21" fill="#fafafa">Tebak Angka</text>
    <rect x="130" y="0" width="120" height="32" rx="8" fill="none" stroke="#27272a"/>
    <text x="190" y="21" fill="#fafafa">Tic-tac-toe</text>
    <rect x="260" y="0" width="110" height="32" rx="8" fill="none" stroke="#27272a"/>
    <text x="315" y="21" fill="#fafafa">Kuis 1001</text>
  </g>

  <!-- panel kuis -->
  <g transform="translate(40,348)">
    <rect width="400" height="420" rx="12" fill="#18181b" stroke="#27272a"/>
    <text x="14" y="26" fill="#16a34a" font-size="16">KUIS 1001</text>
    <text x="386" y="26" fill="#a1a1aa" font-size="12" text-anchor="end" text-decoration="underline">tutup</text>

    <text x="14" y="54" fill="#a1a1aa" font-size="15">SOAL 3/8 — 12 detik</text>
    <text x="14" y="78" fill="#fafafa" font-size="15">Ibu kota Indonesia adalah…</text>

    <!-- opsi A: dipilih -->
    <g>
      <rect x="14" y="94" width="372" height="38" rx="6" fill="#000000" stroke="#16a34a"/>
      <text x="26" y="118" fill="#16a34a" font-size="16">A</text>
      <text x="46" y="118" fill="#fafafa" font-size="15">Jakarta</text>
    </g>
    <!-- opsi B/C/D: normal -->
    <g>
      <rect x="14" y="138" width="372" height="38" rx="6" fill="#000000" stroke="#27272a"/>
      <text x="26" y="162" fill="#16a34a" font-size="16">B</text>
      <text x="46" y="162" fill="#fafafa" font-size="15">Bandung</text>
      <rect x="14" y="182" width="372" height="38" rx="6" fill="#000000" stroke="#27272a"/>
      <text x="26" y="206" fill="#16a34a" font-size="16">C</text>
      <text x="46" y="206" fill="#fafafa" font-size="15">Surabaya</text>
      <rect x="14" y="226" width="372" height="38" rx="6" fill="#000000" stroke="#27272a"/>
      <text x="26" y="250" fill="#16a34a" font-size="16">D</text>
      <text x="46" y="250" fill="#fafafa" font-size="15">Medan</text>
    </g>

    <!-- skor -->
    <g transform="translate(14,278)" font-size="15">
      <text x="0" y="0" fill="#fafafa">dina — 20</text>
      <text x="0" y="20" fill="#fafafa">aku — 10</text>
      <text x="0" y="40" fill="#fafafa">boi — 10</text>
    </g>
    <g transform="translate(14,352)" font-size="14">
      <text x="0" y="0" fill="#a1a1aa">dina: sudah menjawab</text>
      <text x="0" y="18" fill="#a1a1aa">kamu pilih A</text>
    </g>
  </g>

  <!-- form -->
  <g transform="translate(40,786)">
    <text x="0" y="28" fill="#71717a" font-size="16">Ketik pesan…</text>
    <line x1="0" y1="38" x2="320" y2="38" stroke="#e4e4e7"/>
    <rect x="334" y="2" width="40" height="40" rx="8" fill="none" stroke="#27272a"/>
    <rect x="342" y="10" width="24" height="24" rx="4" fill="none" stroke="#a1a1aa" stroke-width="1.5"/>
    <circle cx="350" cy="18" r="2.5" fill="none" stroke="#a1a1aa" stroke-width="1.5"/>
    <rect x="382" y="2" width="40" height="40" rx="8" fill="#16a34a"/>
    <path d="M410 16 l-9 9 -3 -7 -7 -3 9 9 z" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
  <g transform="translate(40,822)" font-size="13" text-anchor="middle">
    <rect x="0" y="16" width="192" height="42" rx="8" fill="none" stroke="#27272a"/>
    <text x="96" y="42" fill="#fafafa">Kamera on</text>
    <rect x="208" y="16" width="110" height="42" rx="8" fill="none" stroke="#27272a"/>
    <text x="263" y="42" fill="#fafafa">Layar</text>
    <rect x="326" y="16" width="96" height="42" rx="8" fill="none" stroke="#27272a"/>
    <text x="374" y="42" fill="#fafafa">Keluar</text>
  </g>

  <text x="240" y="1016" text-anchor="middle" fill="#3f3f46" font-size="11">pratinjau UI — room privat + Kuis 1001</text>
</svg>
