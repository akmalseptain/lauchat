<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 1020" font-family="Geist, ui-sans-serif, system-ui, sans-serif">
  <rect width="480" height="1020" fill="#09090b"/>

  <text x="40" y="42" fill="#fafafa" font-size="13" font-weight="600">ROOM AB12CD</text>
  <text x="150" y="42" fill="#a1a1aa" font-size="12" font-family="Geist Mono, ui-monospace, monospace">· 3 orang</text>

  <!-- video grid 3 cell -->
  <g transform="translate(40,58)">
    <rect width="400" height="200" rx="12" fill="#000000"/>
    <rect x="0" y="0" width="131" height="200" fill="#0a0a0a"/>
    <rect x="135" y="0" width="131" height="200" fill="#0f0f12"/>
    <rect x="269" y="0" width="131" height="200" fill="#0a0a0a"/>
    <g font-family="Geist Mono, ui-monospace, monospace" font-size="10">
      <rect x="6" y="176" width="40" height="17" rx="6" fill="rgba(0,0,0,.55)"/>
      <text x="13" y="188" fill="#e6e6e6">aku</text>
      <rect x="141" y="176" width="42" height="17" rx="6" fill="rgba(0,0,0,.55)"/>
      <text x="148" y="188" fill="#e6e6e6">dina</text>
      <rect x="275" y="176" width="36" height="17" rx="6" fill="rgba(0,0,0,.55)"/>
      <text x="282" y="188" fill="#e6e6e6">boi</text>
    </g>
    <rect x="362" y="8" width="26" height="26" rx="8" fill="rgba(0,0,0,.55)" stroke="rgba(255,255,255,.18)"/>
    <path d="M368 14 h8 v8 M376 14 v8 h-8" fill="none" stroke="#e6e6e6" stroke-width="1.5"/>
    <rect width="400" height="200" rx="12" fill="none" stroke="#27272a"/>
  </g>

  <text x="40" y="286" fill="#a1a1aa" font-size="12" font-family="Geist Mono, ui-monospace, monospace">aku · dina · boi</text>

  <!-- game bar -->
  <g transform="translate(40,302)" font-size="13" text-anchor="middle">
    <rect x="0" y="0" width="120" height="32" rx="8" fill="none" stroke="#27272a"/>
    <text x="60" y="21" fill="#fafafa">Tebak Angka</text>
    <rect x="130" y="0" width="120" height="32" rx="8" fill="none" stroke="#27272a"/>
    <text x="190" y="21" fill="#fafafa">Tic-tac-toe</text>
    <rect x="260" y="0" width="110" height="32" rx="8" fill="none" stroke="#27272a"/>
    <text x="315" y="21" fill="#fafafa">Kuis 1001</text>
  </g>

  <!-- panel kuis -->
  <g transform="translate(40,350)">
    <rect width="400" height="420" rx="12" fill="#18181b" stroke="#27272a"/>
    <text x="14" y="26" fill="#16a34a" font-size="12" letter-spacing="1" font-family="Geist Mono, ui-monospace, monospace">KUIS 1001</text>
    <text x="386" y="26" fill="#a1a1aa" font-size="12" text-anchor="end" text-decoration="underline">tutup</text>

    <text x="14" y="54" fill="#a1a1aa" font-size="12" font-family="Geist Mono, ui-monospace, monospace">SOAL 3/8 — 12 detik</text>
    <text x="14" y="78" fill="#fafafa" font-size="14">Ibu kota Indonesia adalah…</text>

    <g font-size="13">
      <rect x="14" y="94" width="372" height="38" rx="8" fill="#09090b" stroke="#16a34a"/>
      <text x="26" y="118" fill="#16a34a" font-size="12" font-family="Geist Mono, ui-monospace, monospace">A</text>
      <text x="46" y="118" fill="#fafafa">Jakarta</text>
      <rect x="14" y="138" width="372" height="38" rx="8" fill="#09090b" stroke="#27272a"/>
      <text x="26" y="162" fill="#16a34a" font-size="12" font-family="Geist Mono, ui-monospace, monospace">B</text>
      <text x="46" y="162" fill="#fafafa">Bandung</text>
      <rect x="14" y="182" width="372" height="38" rx="8" fill="#09090b" stroke="#27272a"/>
      <text x="26" y="206" fill="#16a34a" font-size="12" font-family="Geist Mono, ui-monospace, monospace">C</text>
      <text x="46" y="206" fill="#fafafa">Surabaya</text>
      <rect x="14" y="226" width="372" height="38" rx="8" fill="#09090b" stroke="#27272a"/>
      <text x="26" y="250" fill="#16a34a" font-size="12" font-family="Geist Mono, ui-monospace, monospace">D</text>
      <text x="46" y="250" fill="#fafafa">Medan</text>
    </g>

    <g transform="translate(14,282)" font-size="12" font-family="Geist Mono, ui-monospace, monospace">
      <text x="0" y="0" fill="#fafafa">dina — 20</text>
      <text x="0" y="20" fill="#fafafa">aku — 10</text>
      <text x="0" y="40" fill="#fafafa">boi — 10</text>
    </g>
    <g transform="translate(14,356)" font-size="11" font-family="Geist Mono, ui-monospace, monospace">
      <text x="0" y="0" fill="#a1a1aa">dina: sudah menjawab</text>
      <text x="0" y="18" fill="#a1a1aa">kamu pilih A</text>
    </g>
  </g>

  <!-- form -->
  <g transform="translate(40,786)">
    <rect width="320" height="40" rx="10" fill="#09090b" stroke="#27272a"/>
    <text x="14" y="25" fill="#71717a" font-size="13">Ketik pesan…</text>
    <rect x="334" y="0" width="40" height="40" rx="8" fill="none" stroke="#27272a"/>
    <rect x="342" y="8" width="24" height="24" rx="4" fill="none" stroke="#a1a1aa" stroke-width="1.5"/>
    <circle cx="350" cy="16" r="2.5" fill="none" stroke="#a1a1aa" stroke-width="1.5"/>
    <rect x="382" y="0" width="40" height="40" rx="8" fill="#16a34a"/>
    <path d="M410 14 l-9 9 -3 -7 -7 -3 9 9 z" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
  <g transform="translate(40,842)" font-size="13" text-anchor="middle">
    <rect x="0" y="0" width="192" height="40" rx="8" fill="none" stroke="#27272a"/>
    <text x="96" y="24" fill="#fafafa">Kamera</text>
    <rect x="208" y="0" width="110" height="40" rx="8" fill="none" stroke="#27272a"/>
    <text x="263" y="24" fill="#fafafa">Layar</text>
    <rect x="326" y="0" width="96" height="40" rx="8" fill="none" stroke="#27272a"/>
    <text x="374" y="24" fill="#fafafa">Keluar</text>
  </g>

  <text x="240" y="996" text-anchor="middle" fill="#3f3f46" font-size="11" font-family="Geist Mono, ui-monospace, monospace">pratinjau UI — room privat + Kuis 1001</text>
</svg>
