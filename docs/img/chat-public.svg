<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 980" font-family="VT323, ui-monospace, Menlo, Consolas, monospace">
  <rect width="480" height="980" fill="#09090b"/>

  <!-- header chat-line -->
  <text x="40" y="42" fill="#fafafa" font-size="14" font-weight="bold">Orang asing: dina</text>
  <text x="163" y="42" fill="#a1a1aa" font-size="14">·</text>
  <text x="173" y="42" fill="#a1a1aa" font-size="15">terhubung, katakan hai</text>
  <text x="330" y="42" fill="#a1a1aa" font-size="14">·</text>
  <text x="340" y="42" fill="#a1a1aa" font-size="15">EN ⇄ ID</text>

  <!-- chip lokasi + bendera pixel -->
  <g transform="translate(40,58)">
    <rect width="212" height="30" rx="15" fill="#1f1f23"/>
    <g transform="translate(12,3)">
      <rect width="40" height="23" fill="#dc2626"/>
      <rect y="12" width="40" height="11" fill="#ffffff"/>
      <g stroke="#09090b" stroke-width="1" opacity=".55">
        <line x1="10" y1="0" x2="10" y2="23"/><line x1="20" y1="0" x2="20" y2="23"/><line x1="30" y1="0" x2="30" y2="23"/>
        <line x1="0" y1="6" x2="40" y2="6"/><line x1="0" y1="12" x2="40" y2="12"/><line x1="0" y1="18" x2="40" y2="18"/>
      </g>
    </g>
    <text x="62" y="21" fill="#fafafa" font-size="15">Dari Bandung · ±1 km</text>
  </g>

  <!-- video split view -->
  <g transform="translate(40,102)">
    <rect width="400" height="225" fill="#000000"/>
    <rect x="0" y="0" width="198" height="225" fill="#0a0a0a"/>
    <rect x="202" y="0" width="198" height="225" fill="#0a0a0a"/>
    <text x="99" y="110" text-anchor="middle" fill="#8b8b90" font-size="15">menunggu video…</text>
    <text x="301" y="110" text-anchor="middle" fill="#8b8b90" font-size="15">menunggu video…</text>
    <rect x="362" y="10" width="26" height="26" rx="6" fill="rgba(0,0,0,.55)" stroke="rgba(255,255,255,.18)"/>
    <rect x="369" y="16" width="12" height="14" rx="2" fill="none" stroke="#e6e6e6" stroke-width="1.5"/>
    <line x1="373" y1="16" x2="373" y2="12" stroke="#e6e6e6" stroke-width="1.5"/>
    <path d="M367 12 l6 -4 6 4" fill="none" stroke="#e6e6e6" stroke-width="1.5"/>
    <rect width="400" height="225" fill="none" stroke="#27272a"/>
  </g>

  <!-- messages -->
  <g transform="translate(40,348)">
    <text x="200" y="0" text-anchor="middle" fill="#a1a1aa" font-size="15">Kamu sekarang ngobrol dengan orang asing.</text>
    <rect x="10" y="22" width="170" height="52" rx="12" fill="#1f1f23"/>
    <text x="24" y="42" fill="#fafafa" font-size="15">halo! asik nih ketemu</text>
    <text x="24" y="60" fill="#fafafa" font-size="15">orang indonesia juga</text>
    <text x="10" y="94" fill="#a1a1aa" font-size="12" text-decoration="underline">terjemah</text>
    <text x="36" y="94" fill="#a1a1aa" font-size="11">21:04</text>
    <rect x="222" y="22" width="160" height="36" rx="12" fill="#16a34a"/>
    <text x="236" y="45" fill="#ffffff" font-size="15">iya, dari jakarta</text>
    <text x="352" y="94" fill="#a1a1aa" font-size="11" text-anchor="end">21:05</text>
    <rect x="10" y="112" width="210" height="36" rx="12" fill="#1f1f23"/>
    <text x="24" y="135" fill="#fafafa" font-size="15">yuk main kuis 1001?</text>
  </g>

  <!-- form -->
  <g transform="translate(40,540)">
    <text x="0" y="30" fill="#71717a" font-size="16">Ketik pesan…</text>
    <line x1="0" y1="40" x2="330" y2="40" stroke="#e4e4e7"/>
    <rect x="344" y="4" width="40" height="40" rx="8" fill="none" stroke="#27272a"/>
    <rect x="352" y="12" width="24" height="24" rx="4" fill="none" stroke="#a1a1aa" stroke-width="1.5"/>
    <circle cx="360" cy="20" r="2.5" fill="none" stroke="#a1a1aa" stroke-width="1.5"/>
    <path d="M368 32 l-6 -6 a3 3 0 0 0 -4 0 l-9 9" fill="none" stroke="#a1a1aa" stroke-width="1.5"/>
    <rect x="392" y="4" width="40" height="40" rx="8" fill="#16a34a"/>
    <path d="M420 18 l-9 9 -3 -7 -7 -3 9 9 z" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>
  </g>

  <!-- controls -->
  <g transform="translate(40,576)" font-size="13" text-anchor="middle">
    <rect x="0" y="16" width="126" height="42" rx="8" fill="none" stroke="#27272a"/>
    <text x="63" y="42" fill="#fafafa">Kamera on</text>
    <rect x="138" y="16" width="126" height="42" rx="8" fill="none" stroke="#27272a"/>
    <text x="201" y="42" fill="#fafafa">Mik on</text>
    <rect x="276" y="16" width="60" height="42" rx="8" fill="none" stroke="#27272a"/>
    <text x="306" y="42" fill="#fafafa" font-size="14">Layar</text>
    <rect x="348" y="16" width="60" height="42" rx="8" fill="none" stroke="#27272a"/>
    <text x="378" y="42" fill="#fafafa" font-size="14">Kuis</text>
  </g>
  <g transform="translate(40,576)" font-size="13" text-anchor="middle">
    <rect x="0" y="66" width="126" height="42" rx="8" fill="none" stroke="#27272a"/>
    <text x="63" y="92" fill="#fafafa">Skip</text>
    <rect x="138" y="66" width="126" height="42" rx="8" fill="none" stroke="#27272a"/>
    <text x="201" y="92" fill="#fafafa">Stop</text>
    <text x="204" y="130" fill="#71717a" font-size="15" text-anchor="middle">Esc</text>
  </g>

  <text x="240" y="956" text-anchor="middle" fill="#3f3f46" font-size="11">pratinjau UI — chat public (split view + chip lokasi pixel + kuis)</text>
</svg>
