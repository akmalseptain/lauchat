<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600" font-family="VT323, monospace">
  <rect width="480" height="600" fill="#000000"/>

  <!-- header -->
  <g transform="translate(40,20)">
    <rect width="20" height="16" rx="4" fill="#3b82f6"/>
    <path d="M5 16 l-3 5 6.5-4.5z" fill="#3b82f6"/>
    <circle cx="10" cy="8" r="4.5" fill="#ffffff"/><circle cx="10" cy="8" r="1.8" fill="#3b82f6"/>
    <text x="28" y="17" fill="#fafafa" font-size="15" font-weight="600" letter-spacing="1">LAUCHAT</text>
  </g>
  <g transform="translate(360,24)">
    <circle cx="6" cy="8" r="3" fill="#16a34a"/>
    <text x="16" y="12" fill="#a1a1aa" font-size="12" font-family="VT323, monospace">12 online</text>
  </g>

  <!-- hero -->
  <text x="40" y="90" fill="#fafafa" font-size="26" font-weight="600">Ngobrol dengan orang asing.</text>
  <text x="40" y="114" fill="#a1a1aa" font-size="14">Dipasangkan acak dengan siapa pun yang online. Tanpa akun, tanpa server.</text>

  <!-- form tanpa kotak -->
  <g transform="translate(40,150)" font-size="13">
    <text x="0" y="14" fill="#71717a">Nama (opsional)</text>
    <line x1="0" y1="28" x2="400" y2="28" stroke="#26262a"/>
    <text x="0" y="62" fill="#71717a">Topik, mis. musik, game (opsional)</text>
    <line x1="0" y1="76" x2="400" y2="76" stroke="#26262a"/>
    <text x="0" y="110" fill="#fafafa">Saya: cowok</text>
    <line x1="0" y1="124" x2="194" y2="124" stroke="#26262a"/>
    <text x="206" y="110" fill="#fafafa">Cari: cewek</text>
    <line x1="206" y1="124" x2="400" y2="124" stroke="#26262a"/>
    <text x="0" y="158" fill="#fafafa">Fasih: Indonesia</text>
    <line x1="0" y1="172" x2="194" y2="172" stroke="#26262a"/>
    <text x="206" y="158" fill="#fafafa">Belajar: English</text>
    <line x1="206" y1="172" x2="400" y2="172" stroke="#26262a"/>
    <rect x="0" y="192" width="15" height="15" rx="4" fill="none" stroke="#a1a1aa" stroke-width="1.5"/>
    <text x="23" y="204" fill="#a1a1aa">Deteksi AI lawan: baca wajah, auto-skip bila tak sesuai</text>
  </g>

  <!-- tombol -->
  <g transform="translate(40,366)">
    <rect width="196" height="40" rx="8" fill="#16a34a"/>
    <path d="M22 19 a9 9 0 1 0 -3.4-3.4 L16 18z" fill="none" stroke="#ffffff" stroke-width="1.6"/>
    <text x="40" y="26" fill="#ffffff" font-size="14" font-weight="500">Chat teks</text>
    <text x="216" y="26" fill="#fafafa" font-size="14" font-weight="500">Chat video</text>
  </g>

  <!-- room row -->
  <g transform="translate(40,426)">
    <line x1="0" y1="0" x2="400" y2="0" stroke="#26262a"/>
    <text x="100" y="30" fill="#71717a" font-size="12" font-family="VT323, monospace" text-anchor="middle" letter-spacing="3">KODE ROOM</text>
    <line x1="0" y1="44" x2="204" y2="44" stroke="#26262a"/>
    <text x="236" y="32" fill="#fafafa" font-size="13">Masuk</text>
    <text x="320" y="32" fill="#fafafa" font-size="13">Buat room</text>
  </g>

  <text x="240" y="522" text-anchor="middle" fill="#71717a" font-size="11" font-family="VT323, monospace">LAUCHAT v17 · 18+ · Tidak dimoderasi · Esc untuk pindah orang</text>
  <text x="240" y="580" text-anchor="middle" fill="#3f3f46" font-size="11" font-family="VT323, monospace">pratinjau UI — beranda / lobby</text>
</svg>
