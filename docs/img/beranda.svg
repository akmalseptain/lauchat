  <text x="240" y="548" text-anchor="middle" fill="#71717a" font-size="11" font-family="Geist Mono, ui-monospace, monospace">LAUCHAT v14 · 18+ · Tidak dimoderasi · Esc untuk pindah orang</text>
  <text x="240" y="640" text-anchor="middle" fill="#3f3f46" font-size="11" font-family="Geist Mono, ui-monospace, monospace">pratinjau UI — beranda / lobby</text>
