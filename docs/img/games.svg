<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 1060" font-family="VT323, ui-monospace, Menlo, Consolas, monospace">
  <rect width="480" height="1060" fill="#09090b"/>

  <!-- header -->
  <text x="40" y="42" fill="#fafafa" font-size="14" font-weight="bold">ROOM AB12CD</text>
  <text x="180" y="42" fill="#a1a1aa" font-size="14">·</text>
  <text x="190" y="42" fill="#a1a1aa" font-size="15">2 orang</text>

  <!-- game bar -->
  <g transform="translate(40,58)" font-size="14" text-anchor="middle">
    <rect x="0" y="0" width="120" height="32" rx="8" fill="none" stroke="#27272a"/>
    <text x="60" y="21" fill="#fafafa">Tebak Angka</text>
    <rect x="130" y="0" width="120" height="32" rx="8" fill="none" stroke="#27272a"/>
    <text x="190" y="21" fill="#fafafa">Tic-tac-toe</text>
    <rect x="260" y="0" width="110" height="32" rx="8" fill="#16a34a"/>
    <text x="315" y="21" fill="#ffffff">Kuis 1001</text>
  </g>

  <!-- panel tic-tac-toe -->
  <g transform="translate(40,106)">
    <rect width="400" height="360" rx="12" fill="#18181b" stroke="#27272a"/>
    <text x="14" y="26" fill="#16a34a" font-size="16">TIC-TAC-TOE</text>
    <text x="386" y="26" fill="#a1a1aa" font-size="12" text-anchor="end" text-decoration="underline">tutup</text>
    <text x="14" y="54" fill="#fafafa" font-size="16">kamu X — GILIRANMU</text>

    <!-- grid 3x3 -->
    <g transform="translate(80,74)">
      <rect x="0" y="0" width="72" height="72" fill="#000000" stroke="#27272a" stroke-width="2"/>
      <rect x="76" y="0" width="72" height="72" fill="#000000" stroke="#27272a" stroke-width="2"/>
      <rect x="152" y="0" width="72" height="72" fill="#000000" stroke="#27272a" stroke-width="2"/>
      <rect x="0" y="76" width="72" height="72" fill="#000000" stroke="#27272a" stroke-width="2"/>
      <rect x="76" y="76" width="72" height="72" fill="#000000" stroke="#16a34a" stroke-width="2"/>
      <rect x="152" y="76" width="72" height="72" fill="#000000" stroke="#27272a" stroke-width="2"/>
      <rect x="0" y="152" width="72" height="72" fill="#000000" stroke="#27272a" stroke-width="2"/>
      <rect x="152" y="152" width="72" height="72" fill="#000000" stroke="#27272a" stroke-width="2"/>

      <!-- X di (0,0) dan (0,2) -->
      <g stroke="#16a34a" stroke-width="3" stroke-linecap="round">
        <line x1="18" y1="18" x2="54" y2="54"/><line x1="54" y1="18" x2="18" y2="54"/>
        <line x1="18" y1="170" x2="54" y2="206"/><line x1="54" y1="170" x2="18" y2="206"/>
      </g>
      <!-- O di (1,0) dan (2,1) -->
      <circle cx="112" cy="36" r="19" fill="none" stroke="#fafafa" stroke-width="3"/>
      <circle cx="188" cy="112" r="19" fill="none" stroke="#fafafa" stroke-width="3"/>
    </g>

    <text x="14" y="300" fill="#a1a1aa" font-size="14">dina bergabung ke tic-tac-toe</text>
    <text x="14" y="320" fill="#a1a1aa" font-size="14">aku: X di kiri-atas</text>
    <text x="14" y="340" fill="#a1a1aa" font-size="14">dina: O di tengah-atas</text>
  </g>

  <!-- panel tebak angka -->
  <g transform="translate(40,486)">
    <rect width="400" height="330" rx="12" fill="#18181b" stroke="#27272a"/>
    <text x="14" y="26" fill="#16a34a" font-size="16">TEBAK ANGKA</text>
    <text x="386" y="26" fill="#a1a1aa" font-size="12" text-anchor="end" text-decoration="underline">tutup</text>
    <text x="14" y="54" fill="#fafafa" font-size="16">aku memikirkan angka 1–100…</text>

    <rect x="14" y="72" width="300" height="44" fill="#000000" stroke="#27272a"/>
    <text x="30" y="100" fill="#a1a1aa" font-size="16">1–100</text>
    <rect x="322" y="72" width="64" height="44" rx="8" fill="#16a34a"/>
    <text x="354" y="100" fill="#ffffff" font-size="16" text-anchor="middle">Kirim</text>

    <g transform="translate(14,140)" font-size="15">
      <text x="0" y="0" fill="#fafafa">aku: 50</text>
      <text x="60" y="0" fill="#a1a1aa" font-size="14">→ besar, turun</text>
      <text x="0" y="26" fill="#fafafa">aku: 25</text>
      <text x="60" y="26" fill="#a1a1aa" font-size="14">→ besar, turun</text>
      <text x="0" y="52" fill="#fafafa">aku: 12</text>
      <text x="60" y="52" fill="#a1a1aa" font-size="14">→ kecil, naik</text>
      <text x="0" y="78" fill="#a1a1aa" font-size="14">tebakan lawan: 70 → kecil, naik</text>
      <text x="0" y="104" fill="#a1a1aa" font-size="14">tebakan lawan: 80 → kecil, naik</text>
    </g>

    <text x="14" y="308" fill="#71717a" font-size="14">makin dekat ke angka rahasia, makin cepat menang</text>
  </g>

  <text x="240" y="1036" text-anchor="middle" fill="#3f3f46" font-size="11">pratinjau UI — panel game di room privat (tic-tac-toe &amp; tebak angka)</text>
</svg>
