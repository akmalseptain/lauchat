<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 840" font-family="Geist, ui-sans-serif, system-ui, sans-serif">
  <rect width="480" height="840" fill="#09090b"/>

  <text x="40" y="42" fill="#fafafa" font-size="13" font-weight="600">ROOM AB12CD</text>
  <text x="150" y="42" fill="#a1a1aa" font-size="12" font-family="Geist Mono, ui-monospace, monospace">· 3 orang</text>

  <!-- video utama spotlight 16:9 -->
  <g transform="translate(40,58)">
    <rect width="400" height="225" rx="12" fill="#0a0a0a"/>
    <rect x="6" y="201" width="46" height="17" rx="6" fill="rgba(0,0,0,.55)"/>
    <text x="13" y="213" fill="#e6e6e6" font-size="10" font-family="Geist Mono, ui-monospace, monospace">dina</text>
    <rect x="362" y="8" width="26" height="26" rx="8" fill="rgba(0,0,0,.55)" stroke="rgba(255,255,255,.18)"/>
    <rect x="368" y="14" width="14" height="14" rx="2" fill="none" stroke="#e6e6e6" stroke-width="1.5"/>
    <path d="M368 14 l7 -4 7 4" fill="none" stroke="#e6e6e6" stroke-width="1.5"/>
    <rect width="400" height="225" rx="12" fill="none" stroke="#27272a"/>
  </g>

  <!-- thumbnail strip -->
  <g transform="translate(40,295)">
    <rect width="110" height="66" rx="8" fill="#0f0f12" stroke="#16a34a"/>
    <rect x="6" y="45" width="32" height="15" rx="6" fill="rgba(0,0,0,.55)"/>
    <text x="12" y="56" fill="#e6e6e6" font-size="10" font-family="Geist Mono, ui-monospace, monospace">aku</text>
    <rect x="120" width="110" height="66" rx="8" fill="#0f0f12" stroke="#27272a"/>
    <rect x="126" y="45" width="32" height="15" rx="6" fill="rgba(0,0,0,.55)"/>
    <text x="132" y="56" fill="#e6e6e6" font-size="10" font-family="Geist Mono, ui-monospace, monospace">boi</text>
    <text x="245" y="40" fill="#71717a" font-size="12">← klik untuk tukar</text>
  </g>

  <text x="40" y="392" fill="#a1a1aa" font-size="12" font-family="Geist Mono, ui-monospace, monospace">aku · dina · boi</text>

  <!-- game bar -->
  <g transform="translate(40,406)" font-size="13" text-anchor="middle">
    <rect x="0" y="0" width="120" height="32" rx="8" fill="none" stroke="#27272a"/>
    <text x="60" y="21" fill="#fafafa">Tebak Angka</text>
    <rect x="130" y="0" width="120" height="32" rx="8" fill="none" stroke="#27272a"/>
    <text x="190" y="21" fill="#fafafa">Tic-tac-toe</text>
    <rect x="260" y="0" width="110" height="32" rx="8" fill="none" stroke="#27272a"/>
    <text x="315" y="21" fill="#fafafa">Kuis 1001</text>
  </g>

  <!-- chat log -->
  <g transform="translate(40,454)">
    <rect width="400" height="112" rx="12" fill="#18181b" stroke="#27272a"/>
    <rect x="12" y="10" width="180" height="34" rx="12" fill="#27272a"/>
    <text x="26" y="32" fill="#fafafa" font-size="13">gas kuis 1001 3 ronde</text>
    <rect x="216" y="52" width="160" height="34" rx="12" fill="#16a34a"/>
    <text x="230" y="74" fill="#ffffff" font-size="13">siap, aku duluan</text>
  </g>

  <!-- form + controls -->
  <g transform="translate(40,582)">
    <rect width="320" height="40" rx="10" fill="#09090b" stroke="#27272a"/>
    <text x="14" y="25" fill="#71717a" font-size="13">Ketik pesan…</text>
    <rect x="334" y="0" width="40" height="40" rx="8" fill="none" stroke="#27272a"/>
    <rect x="342" y="8" width="24" height="24" rx="4" fill="none" stroke="#a1a1aa" stroke-width="1.5"/>
    <circle cx="350" cy="16" r="2.5" fill="none" stroke="#a1a1aa" stroke-width="1.5"/>
    <rect x="382" y="0" width="40" height="40" rx="8" fill="#16a34a"/>
    <path d="M410 14 l-9 9 -3 -7 -7 -3 9 9 z" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
  <g transform="translate(40,638)" font-size="13" text-anchor="middle">
    <rect x="0" y="0" width="192" height="40" rx="8" fill="none" stroke="#27272a"/>
    <text x="96" y="24" fill="#fafafa">Kamera</text>
    <rect x="208" y="0" width="110" height="40" rx="8" fill="none" stroke="#27272a"/>
    <text x="263" y="24" fill="#fafafa">Layar</text>
    <rect x="326" y="0" width="96" height="40" rx="8" fill="none" stroke="#27272a"/>
    <text x="374" y="24" fill="#fafafa">Keluar</text>
  </g>

  <text x="240" y="816" text-anchor="middle" fill="#3f3f46" font-size="11" font-family="Geist Mono, ui-monospace, monospace">pratinjau UI — mode spotlight (klik thumbnail untuk tukar)</text>
</svg>
