<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 900" font-family="Geist, ui-sans-serif, system-ui, sans-serif">
  <rect width="480" height="900" fill="#000000"/>

  <text x="40" y="42" fill="#fafafa" font-size="13" font-weight="600">Orang asing: dina</text>
  <text x="170" y="42" fill="#a1a1aa" font-size="12" font-family="Geist Mono, ui-monospace, monospace">· terhubung, katakan hai · EN ⇄ ID</text>

  <!-- chip lokasi: kode negara teks -->
  <g transform="translate(40,58)">
    <path d="M8 0a6 6 0 0 0-6 6c0 4.5 6 9 6 9s6-4.5 6-9a6 6 0 0 0-6-6z" transform="translate(0,2)" fill="none" stroke="#a1a1aa" stroke-width="1.4"/>
    <circle cx="8" cy="8" r="2" fill="none" stroke="#a1a1aa" stroke-width="1.4"/>
    <g transform="translate(24,2)">
      <rect width="20" height="18" fill="#dc2626"/>
      <rect y="9" width="20" height="9" fill="#ffffff"/>
      <g stroke="#000000" stroke-width="1" opacity=".55">
        <line x1="5" y1="0" x2="5" y2="18"/><line x1="10" y1="0" x2="10" y2="18"/><line x1="15" y1="0" x2="15" y2="18"/>
        <line x1="0" y1="5" x2="20" y2="5"/><line x1="0" y1="9" x2="20" y2="9"/><line x1="0" y1="14" x2="20" y2="14"/>
      </g>
    </g>
    <text x="52" y="18" fill="#a1a1aa" font-size="12">Dari Bandung · ±1 km</text>
  </g>

  <!-- video split view (tanpa bingkai) -->
  <g transform="translate(40,96)">
    <rect width="198" height="225" rx="12" fill="#0a0a0a"/>
    <rect x="202" width="198" height="225" rx="12" fill="#0a0a0a"/>
    <text x="99" y="110" text-anchor="middle" fill="#8b8b90" font-size="13">menunggu video…</text>
    <text x="301" y="110" text-anchor="middle" fill="#8b8b90" font-size="13">menunggu video…</text>
    <rect x="348" y="8" width="26" height="26" rx="8" fill="rgba(0,0,0,.55)" stroke="rgba(255,255,255,.18)"/>
    <rect x="355" y="14" width="12" height="14" rx="2" fill="none" stroke="#e6e6e6" stroke-width="1.5"/>
    <line x1="359" y1="14" x2="359" y2="10" stroke="#e6e6e6" stroke-width="1.5"/>
    <path d="M353 10 l6 -4 6 4" fill="none" stroke="#e6e6e6" stroke-width="1.5"/>
  </g>

  <!-- messages (tanpa container) -->
  <g transform="translate(40,342)">
    <text x="200" y="0" text-anchor="middle" fill="#a1a1aa" font-size="11" font-family="Geist Mono, ui-monospace, monospace">Kamu sekarang ngobrol dengan orang asing.</text>
    <rect x="10" y="18" width="170" height="52" rx="12" fill="#1c1c1f"/>
    <text x="24" y="38" fill="#fafafa" font-size="13">halo! asik nih ketemu</text>
    <text x="24" y="56" fill="#fafafa" font-size="13">orang indonesia juga</text>
    <text x="10" y="86" fill="#a1a1aa" font-size="12" text-decoration="underline">terjemah</text>
    <text x="72" y="86" fill="#a1a1aa" font-size="10" font-family="Geist Mono, ui-monospace, monospace">21:04</text>
    <rect x="222" y="18" width="160" height="36" rx="12" fill="#16a34a"/>
    <text x="236" y="41" fill="#ffffff" font-size="13">iya, dari jakarta</text>
    <text x="382" y="86" fill="#a1a1aa" font-size="10" text-anchor="end" font-family="Geist Mono, ui-monospace, monospace">21:05</text>
    <rect x="10" y="94" width="150" height="36" rx="12" fill="#1c1c1f"/>
    <text x="24" y="117" fill="#fafafa" font-size="13">yuk main kuis?</text>
  </g>

  <!-- form underline -->
  <g transform="translate(40,502)">
    <text x="0" y="18" fill="#71717a" font-size="13">Ketik pesan…</text>
    <line x1="0" y1="30" x2="330" y2="30" stroke="#26262a"/>
    <rect x="344" y="-8" width="40" height="40" rx="8" fill="none" stroke="#a1a1aa"/>
    <rect x="352" y="0" width="24" height="24" rx="4" fill="none" stroke="#a1a1aa" stroke-width="1.5"/>
    <circle cx="360" cy="8" r="2.5" fill="none" stroke="#a1a1aa" stroke-width="1.5"/>
    <path d="M368 20 l-6 -6 a3 3 0 0 0 -4 0 l-9 9" fill="none" stroke="#a1a1aa" stroke-width="1.5"/>
    <rect x="392" y="-8" width="40" height="40" rx="8" fill="#16a34a"/>
    <path d="M420 6 l-9 9 -3 -7 -7 -3 9 9 z" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>
  </g>

  <!-- controls: teks saja, Skip primary -->
  <g transform="translate(40,566)" font-size="13" text-anchor="middle">
    <text x="47" y="14" fill="#fafafa">Kamera</text>
    <text x="149" y="14" fill="#fafafa">Mik</text>
    <text x="251" y="14" fill="#fafafa">Layar</text>
    <text x="353" y="14" fill="#fafafa">Kuis</text>
    <rect x="0" y="28" width="196" height="40" rx="8" fill="#16a34a"/>
    <text x="98" y="53" fill="#ffffff" font-weight="500">Skip</text>
    <text x="302" y="53" fill="#fafafa">Stop</text>
  </g>
  <text x="40" y="648" fill="#71717a" font-size="11" font-family="Geist Mono, ui-monospace, monospace">Esc = skip</text>

  <text x="240" y="876" text-anchor="middle" fill="#3f3f46" font-size="11" font-family="Geist Mono, ui-monospace, monospace">pratinjau UI — chat public (split view + chip lokasi + kuis)</text>
</svg>
