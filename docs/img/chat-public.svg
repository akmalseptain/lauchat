<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 960" font-family="Geist, ui-sans-serif, system-ui, sans-serif">
  <rect width="480" height="960" fill="#000000"/>
  <g font-family="Geist Mono, ui-monospace, monospace">
    <text x="40" y="42" fill="#fafafa" font-size="13" font-weight="600" font-family="Geist, sans-serif">Orang asing: dina</text>
    <text x="170" y="42" fill="#a1a1aa" font-size="12">· terhubung, katakan hai · EN ⇄ ID</text>
  </g>

  <!-- chip lokasi + bendera pixel -->
  <g transform="translate(40,58)">
    <rect width="216" height="30" rx="15" fill="none" stroke="#27272a"/>
    <g transform="translate(12,6)">
      <rect width="20" height="18" fill="#dc2626"/>
      <rect y="9" width="20" height="9" fill="#ffffff"/>
      <g stroke="#000000" stroke-width="1" opacity=".55">
        <line x1="5" y1="0" x2="5" y2="18"/><line x1="10" y1="0" x2="10" y2="18"/><line x1="15" y1="0" x2="15" y2="18"/>
        <line x1="0" y1="5" x2="20" y2="5"/><line x1="0" y1="9" x2="20" y2="9"/><line x1="0" y1="14" x2="20" y2="14"/>
      </g>
    </g>
    <text x="42" y="20" fill="#a1a1aa" font-size="12">Dari Bandung · ±1 km</text>
  </g>

  <!-- video split view -->
  <g transform="translate(40,102)">
    <rect width="400" height="225" rx="12" fill="#000000"/>
    <rect x="0" y="0" width="198" height="225" fill="#0a0a0a"/>
    <rect x="202" y="0" width="198" height="225" fill="#0a0a0a"/>
    <text x="99" y="110" text-anchor="middle" fill="#8b8b90" font-size="13">menunggu video…</text>
    <text x="301" y="110" text-anchor="middle" fill="#8b8b90" font-size="13">menunggu video…</text>
    <rect x="362" y="10" width="26" height="26" rx="8" fill="rgba(0,0,0,.55)" stroke="rgba(255,255,255,.18)"/>
    <rect x="369" y="16" width="12" height="14" rx="2" fill="none" stroke="#e6e6e6" stroke-width="1.5"/>
    <line x1="373" y1="16" x2="373" y2="12" stroke="#e6e6e6" stroke-width="1.5"/>
    <path d="M367 12 l6 -4 6 4" fill="none" stroke="#e6e6e6" stroke-width="1.5"/>
    <rect width="400" height="225" rx="12" fill="none" stroke="#27272a"/>
  </g>

  <!-- messages -->
  <g transform="translate(40,348)">
    <rect width="400" height="168" rx="12" fill="none" stroke="#27272a"/>
    <text x="200" y="22" text-anchor="middle" fill="#a1a1aa" font-size="11" font-family="Geist Mono, ui-monospace, monospace">Kamu sekarang ngobrol dengan orang asing.</text>
    <rect x="10" y="40" width="170" height="52" rx="12" fill="#1c1c1f"/>
    <text x="24" y="60" fill="#fafafa" font-size="13">halo! asik nih ketemu</text>
    <text x="24" y="78" fill="#fafafa" font-size="13">orang indonesia juga</text>
    <text x="10" y="108" fill="#a1a1aa" font-size="12" text-decoration="underline">terjemah</text>
    <text x="72" y="108" fill="#a1a1aa" font-size="10" font-family="Geist Mono, ui-monospace, monospace">21:04</text>
    <rect x="222" y="40" width="160" height="36" rx="12" fill="#16a34a"/>
    <text x="236" y="63" fill="#ffffff" font-size="13">iya, dari jakarta</text>
    <text x="382" y="108" fill="#a1a1aa" font-size="10" text-anchor="end" font-family="Geist Mono, ui-monospace, monospace">21:05</text>
    <rect x="10" y="116" width="150" height="36" rx="12" fill="#1c1c1f"/>
    <text x="24" y="139" fill="#fafafa" font-size="13">yuk main kuis?</text>
  </g>

  <!-- form -->
  <g transform="translate(40,532)">
    <rect width="330" height="40" rx="10" fill="none" stroke="#27272a"/>
    <text x="14" y="25" fill="#71717a" font-size="13">Ketik pesan…</text>
    <rect x="344" y="0" width="40" height="40" rx="8" fill="none" stroke="#27272a"/>
    <rect x="352" y="8" width="24" height="24" rx="4" fill="none" stroke="#a1a1aa" stroke-width="1.5"/>
    <circle cx="360" cy="16" r="2.5" fill="none" stroke="#a1a1aa" stroke-width="1.5"/>
    <path d="M368 28 l-6 -6 a3 3 0 0 0 -4 0 l-9 9" fill="none" stroke="#a1a1aa" stroke-width="1.5"/>
    <rect x="392" y="0" width="40" height="40" rx="8" fill="#16a34a"/>
    <path d="M420 14 l-9 9 -3 -7 -7 -3 9 9 z" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>
  </g>

  <!-- controls -->
  <g transform="translate(40,588)" font-size="13" text-anchor="middle">
    <rect x="0" y="0" width="94" height="40" rx="8" fill="none" stroke="#27272a"/>
    <text x="47" y="24" fill="#fafafa">Kamera</text>
    <rect x="102" y="0" width="94" height="40" rx="8" fill="none" stroke="#27272a"/>
    <text x="149" y="24" fill="#fafafa">Mik</text>
    <rect x="204" y="0" width="94" height="40" rx="8" fill="none" stroke="#27272a"/>
    <text x="251" y="24" fill="#fafafa">Layar</text>
    <rect x="306" y="0" width="94" height="40" rx="8" fill="none" stroke="#27272a"/>
    <text x="353" y="24" fill="#fafafa">Kuis</text>
    <rect x="0" y="48" width="196" height="40" rx="8" fill="#16a34a"/>
    <text x="98" y="72" fill="#ffffff" font-weight="500">Skip</text>
    <rect x="204" y="48" width="196" height="40" rx="8" fill="none" stroke="#27272a"/>
    <text x="302" y="72" fill="#fafafa">Stop</text>
  </g>
  <text x="40" y="706" fill="#71717a" font-size="11" font-family="Geist Mono, ui-monospace, monospace">Esc = skip</text>

  <text x="240" y="936" text-anchor="middle" fill="#3f3f46" font-size="11" font-family="Geist Mono, ui-monospace, monospace">pratinjau UI — chat public (split view + chip lokasi pixel + kuis)</text>
</svg>
