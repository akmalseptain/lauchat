<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 980" font-family="Geist, ui-sans-serif, system-ui, sans-serif">
  <rect width="480" height="980" fill="#000000"/>

  <text x="40" y="42" fill="#fafafa" font-size="13" font-weight="600">ROOM AB12CD</text>
  <text x="150" y="42" fill="#a1a1aa" font-size="12" font-family="Geist Mono, ui-monospace, monospace">· 3 orang</text>

  <!-- video spotlight (default) -->
  <g transform="translate(40,58)">
    <rect width="400" height="225" rx="12" fill="#0a0a0a"/>
    <rect x="6" y="201" width="42" height="16" rx="6" fill="rgba(0,0,0,.55)"/>
    <text x="13" y="212" fill="#e6e6e6" font-size="10" font-family="Geist Mono, ui-monospace, monospace">dina</text>
    <rect x="362" y="8" width="26" height="26" rx="8" fill="rgba(0,0,0,.55)" stroke="rgba(255,255,255,.18)"/>
    <rect x="368" y="14" width="14" height="14" rx="2" fill="none" stroke="#e6e6e6" stroke-width="1.5"/>
    <path d="M368 14 l7 -4 7 4" fill="none" stroke="#e6e6e6" stroke-width="1.5"/>
  </g>
  <g transform="translate(40,295)">
    <rect width="110" height="66" rx="8" fill="#0f0f12"/>
    <rect x="6" y="45" width="32" height="15" rx="6" fill="rgba(0,0,0,.55)"/>
    <text x="12" y="56" fill="#e6e6e6" font-size="10" font-family="Geist Mono, ui-monospace, monospace">aku</text>
    <rect x="120" width="110" height="66" rx="8" fill="#0f0f12"/>
    <rect x="126" y="45" width="32" height="15" rx="6" fill="rgba(0,0,0,.55)"/>
    <text x="132" y="56" fill="#e6e6e6" font-size="10" font-family="Geist Mono, ui-monospace, monospace">boi</text>
    <text x="245" y="40" fill="#71717a" font-size="12">← klik untuk tukar</text>
  </g>

  <text x="40" y="392" fill="#a1a1aa" font-size="12" font-family="Geist Mono, ui-monospace, monospace">aku · dina · boi</text>

  <!-- game bar: teks saja -->
  <g transform="translate(40,406)" font-size="13" text-anchor="middle">
    <text x="60" y="21" fill="#fafafa">Tebak Angka</text>
    <text x="190" y="21" fill="#fafafa">Tic-tac-toe</text>
    <text x="315" y="21" fill="#16a34a" font-weight="500">Kuis 1001</text>
  </g>

  <!-- panel kuis: tanpa bingkai, opsi tint -->
  <g transform="translate(40,442)">
    <text x="0" y="26" fill="#16a34a" font-size="12" letter-spacing="1" font-family="Geist Mono, ui-monospace, monospace">KUIS 1001</text>
    <text x="400" y="26" fill="#a1a1aa" font-size="12" text-anchor="end" text-decoration="underline">tutup</text>

    <text x="0" y="54" fill="#a1a1aa" font-size="12" font-family="Geist Mono, ui-monospace, monospace">SOAL 3/8 — 12 detik</text>
    <text x="0" y="78" fill="#fafafa" font-size="14">Ibu kota Indonesia adalah…</text>

    <g font-size="13">
      <rect x="-8" y="90" width="392" height="38" rx="8" fill="rgba(22,163,74,.14)"/>
      <text x="4" y="114" fill="#16a34a" font-size="12" font-family="Geist Mono, ui-monospace, monospace">A</text>
      <text x="24" y="114" fill="#fafafa">Jakarta</text>
      <text x="4" y="158" fill="#16a34a" font-size="12" font-family="Geist Mono, ui-monospace, monospace">B</text>
      <text x="24" y="158" fill="#fafafa">Bandung</text>
      <text x="4" y="202" fill="#16a34a" font-size="12" font-family="Geist Mono, ui-monospace, monospace">C</text>
      <text x="24" y="202" fill="#fafafa">Surabaya</text>
      <text x="4" y="246" fill="#16a34a" font-size="12" font-family="Geist Mono, ui-monospace, monospace">D</text>
      <text x="24" y="246" fill="#fafafa">Medan</text>
    </g>

    <g transform="translate(0,282)" font-size="12" font-family="Geist Mono, ui-monospace, monospace">
      <text x="0" y="0" fill="#fafafa">dina — 20</text>
      <text x="0" y="20" fill="#fafafa">aku — 10</text>
      <text x="0" y="40" fill="#fafafa">boi — 10</text>
    </g>
    <g transform="translate(0,356)" font-size="11" font-family="Geist Mono, ui-monospace, monospace">
      <text x="0" y="0" fill="#a1a1aa">dina: sudah menjawab</text>
      <text x="0" y="18" fill="#a1a1aa">kamu pilih A</text>
    </g>
  </g>

  <!-- form underline -->
  <g transform="translate(40,810)">
    <text x="0" y="18" fill="#71717a" font-size="13">Ketik pesan…</text>
    <line x1="0" y1="30" x2="320" y2="30" stroke="#26262a"/>
    <rect x="334" y="0" width="40" height="40" rx="8" fill="none" stroke="#a1a1aa"/>
    <rect x="342" y="8" width="24" height="24" rx="4" fill="none" stroke="#a1a1aa" stroke-width="1.5"/>
    <circle cx="350" cy="16" r="2.5" fill="none" stroke="#a1a1aa" stroke-width="1.5"/>
    <rect x="382" y="0" width="40" height="40" rx="8" fill="#16a34a"/>
    <path d="M410 14 l-9 9 -3 -7 -7 -3 9 9 z" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
  <g transform="translate(40,866)" font-size="13" text-anchor="middle">
    <text x="40" y="14" fill="#fafafa">Kamera</text>
    <text x="163" y="14" fill="#fafafa">Layar</text>
    <text x="344" y="14" fill="#fafafa">Keluar</text>
  </g>

  <text x="240" y="956" text-anchor="middle" fill="#3f3f46" font-size="11" font-family="Geist Mono, ui-monospace, monospace">pratinjau UI — room privat + Kuis 1001 (spotlight default)</text>
</svg>
